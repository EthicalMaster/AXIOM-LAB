name: release-security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_private_files.py
      - name: Install and audit resolved Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/axiom-audit-venv"
          py="$RUNNER_TEMP/axiom-audit-venv/bin/python"
          "$py" -m pip install './backend[dev]' pip-audit
          "$py" -m pip check
          # Exclude only the unpublished first-party project, not its dependencies.
          "$py" -m pip list --format=freeze --exclude axiom-lab-backend > "$RUNNER_TEMP/axiom-audit-requirements.txt"
          test -s "$RUNNER_TEMP/axiom-audit-requirements.txt"
          "$py" -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/axiom-audit-requirements.txt"
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
